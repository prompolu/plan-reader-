# Local / single-host deployment: PostgreSQL, the API (serves the web app) and a
# processing worker. Drawings are stored in the private `storage` volume and are
# only ever served through the API's signed links.
#
#   PM_SECRET_KEY=$(openssl rand -hex 32) docker compose up --build
#   open http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: planmeasure
      POSTGRES_PASSWORD: ${PM_DB_PASSWORD:-planmeasure}
      POSTGRES_DB: planmeasure
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planmeasure"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &env
      PM_DATABASE_URL: postgresql+psycopg://planmeasure:${PM_DB_PASSWORD:-planmeasure}@db:5432/planmeasure
      PM_SECRET_KEY: ${PM_SECRET_KEY:?set PM_SECRET_KEY to a random string of 32+ characters}
      PM_ENV: ${PM_ENV:-development}
      PM_COOKIE_SECURE: ${PM_COOKIE_SECURE:-false}
      PM_VISION_PROVIDER: ${PM_VISION_PROVIDER:-none}
      PM_ANTHROPIC_API_KEY: ${PM_ANTHROPIC_API_KEY:-}
    volumes:
      - storage:/data/storage
    ports:
      - "8000:8000"

  worker:
    build: .
    command: ["python", "-m", "planmeasure.worker"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment: *env
    volumes:
      - storage:/data/storage

volumes:
  pgdata:
  storage:
