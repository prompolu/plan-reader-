[project]
name = "planmeasure"
version = "1.0.0"
description = "PlanMeasure AI - opening measurement extraction from architectural drawings"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "pillow>=10.3",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pytesseract>=0.3.10",
    "reportlab>=4.2",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
s3 = ["boto3>=1.34"]
redis = ["redis>=5.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["planmeasure*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
